name: DB Types Drift

# 커밋된 supabase/migrations 로부터 로컬에서 타입을 재생성해
# 커밋된 database.types.ts 와 어긋나는지(drift) 검사한다. Supabase 토큰 불필요.
on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'src/shared/lib/supabase/database.types.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/db-types.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'src/shared/lib/supabase/database.types.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/db-types.yml'

concurrency:
  group: db-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout + 로컬 타입 생성/비교만 — 쓰기 권한 불필요(최소 권한)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # lint.yml과 동일: 토큰 git config 잔존 방지

      # pnpm 버전은 package.json의 packageManager 필드를 단일 진실 원천으로 사용.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 로컬 Supabase 스택 기동 → 커밋된 마이그레이션을 자동 적용.
      # 정규 이미지라 auth/role/extension 포함 → RLS 참조 스키마(anon/pg_database_owner 등)도 깨끗이 적용된다.
      # 타입 생성은 db에 직접 연결하므로 db 외 서비스는 불필요. `-x`로 제외해
      # (1) 기동을 빠르게 하고 (2) db와 무관한 서비스 health check 실패로 인한 CI false-failure를 막는다.
      - name: Start Supabase (apply migrations)
        run: pnpm exec supabase start -x studio,realtime,storage-api,imgproxy,mailpit,edge-runtime,logflare,vector

      - name: Generate types from local schema
        run: pnpm exec supabase gen types typescript --local --schema public > /tmp/fresh.types.ts

      # __InternalSupabase(PostgREST 버전 메타 — 스키마와 무관)와 빈 줄 차이는 정규화로 제외하고
      # 스키마 파생 타입 본문만 비교한다. 원격(`db:types`)/로컬(`db:types:local`) 어느 스크립트로
      # 재생성해도 본문이 같으면 통과한다.
      - name: Compare against committed types
        run: |
          strip() {
            sed -e '/\/\/ Allows to automatically instantiate/d' \
                -e '/\/\/ instead of createClient/d' \
                -e '/__InternalSupabase: {/,/^  }$/d' "$1"
          }
          if diff -B <(strip /tmp/fresh.types.ts) <(strip src/shared/lib/supabase/database.types.ts); then
            echo "✅ No type drift — committed types match supabase/migrations."
          else
            echo "::error::database.types.ts is out of sync with supabase/migrations."
            echo "Run 'pnpm db:types:local' (or 'pnpm db:types') and commit the regenerated file."
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop